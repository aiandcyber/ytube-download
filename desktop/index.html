<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Download</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <div>
            <strong>YouTube Download</strong>
            <span class="sub">AI-forAll Tools</span>
          </div>
        </div>
        <div class="account">
          <span id="account-label" class="account-label">Not signed in</span>
          <button type="button" id="auth-btn" class="btn ghost">Sign in</button>
        </div>
      </header>

      <main class="panel">
        <h1>Save a video or audio track</h1>
        <p class="hint">Choose quality and where to save, then download.</p>

        <div class="segment" role="group" aria-label="Format">
          <button type="button" id="mode-mp4" class="seg on">MP4</button>
          <button type="button" id="mode-mp3" class="seg">MP3</button>
        </div>

        <label class="field" id="quality-wrap">
          <span id="quality-label">Video quality</span>
          <select id="quality"></select>
        </label>

        <label class="field">
          <span>YouTube link</span>
          <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" />
        </label>

        <div class="save-row">
          <label class="field grow">
            <span>Save folder</span>
            <input id="save-dir" type="text" readonly placeholder="Downloads (default)" />
          </label>
          <button type="button" id="pick-folder" class="btn ghost save-btn">Choose…</button>
        </div>

        <div class="actions">
          <button type="button" id="run" class="btn primary">Download</button>
          <button type="button" id="cancel" class="btn ghost danger hidden">Cancel</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </main>
    </div>
  </body>
</html>
