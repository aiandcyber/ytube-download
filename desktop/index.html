<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Download</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <div class="mark" aria-hidden="true">▶</div>
        <div>
          <p class="kicker">Desktop · Windows &amp; Mac</p>
          <h1>YouTube Download</h1>
          <p class="lead">
            We do not support downloading YouTube video on our server. You can download on your
            personal device for personal listening again.
          </p>
        </div>
      </header>

      <div class="mode" role="group" aria-label="Format">
        <button type="button" id="mode-mp4" class="chip on">MP4 video</button>
        <button type="button" id="mode-mp3" class="chip">MP3 audio</button>
      </div>

      <label class="field">
        <span>YouTube URL</span>
        <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…" />
      </label>

      <button type="button" id="run" class="primary">Download</button>
      <p id="status" class="status" role="status"></p>
    </main>
  </body>
</html>
