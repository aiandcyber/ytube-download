# WSL/Windows: edit + push. GitHub Actions builds native installers.
# Mac: macos-latest runner (no local Mac required). Unsigned until Apple cert secrets are added.
name: Tauri desktop release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: app-v__VERSION__
          releaseName: "YouTube Download v__VERSION__"
          releaseBody: "YouTube Download for Windows and Mac. Prefer the simple download page: https://aiandcyber.github.io/ytube-download/ — choose Windows or Mac and press Download."
          releaseDraft: false
          prerelease: false
          args: ""

  publish-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: app-v__VERSION__
          releaseName: "YouTube Download v__VERSION__"
          releaseBody: "YouTube Download for Windows and Mac. Prefer the simple download page: https://aiandcyber.github.io/ytube-download/ — choose Windows or Mac and press Download."
          releaseDraft: false
          prerelease: false
          args: ""
